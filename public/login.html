<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>𝅘𝅥𝅮 log in - mini melodies</title>
        <link rel="stylesheet" href="https://unpkg.com/simpledotcss/simple.min.css">
        <link rel='stylesheet' href='css/main.css' />

        <!-- get rid of favicon error -->
        <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
    </head>
    <body>
        <nav>
            <h1>𝅘𝅥𝅮 mini melodies</h1>
            <div class="account-buttons">
                <p id="logged-in-status">not logged in</p>
                <a class="button" href="/create-account" style="visibility: visible">create account</a>
                <a class="button" href="/login" style="visibility: visible" aria-current="page">log in</a>
            </div>
        </nav>
        <main>
            <h2>log in</h2>
            <form id="login-form" action="/login-submit" method="POST">
                <div class="row"><label for="username">username:</label><input id="username" name="username" type="text" placeholder="jackson5" required /></div>
                <div class="row"><label for="password">password:</label><input id="password" name="password" type="password" placeholder="abc123" required /></div>
                <input type="submit" value="log in" />
            </form>
        </main>
    </body>
</html>
