<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>𝅘𝅥𝅮 new account - mini melodies</title>
        <link rel="stylesheet" href="https://unpkg.com/simpledotcss/simple.min.css">
        <link rel='stylesheet' href='css/main.css' />
    </head>
    <body>
        <nav>
            <h1>𝅘𝅥𝅮 mini melodies</h1>
            <div class="account-buttons">
                <p id="logged-in-status">not logged in</p>
                <a class="button" href="/new-account">new account</a>
                <a class="button" href="/login" aria-current="page">log in</a>
            </div>
        </nav>
        <main>
            <h2>new account</h2>
            <form id="login-form">
                <div class="row"><label for="username">username:</label><input id="username" type="text" placeholder="jackson5" required /></div>
                <div class="row"><label for="password">password:</label><input id="password" type="password" placeholder="abc123" required /></div>
                <input type="submit" value="create account" />
            </form>
        </main>
    </body>
</html>
